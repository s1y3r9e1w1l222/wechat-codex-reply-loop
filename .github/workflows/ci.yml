name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.9'
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Test synthetic scenarios
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Compile source
        run: python -m compileall -q src scripts
      - name: Replay without device or credentials
        env:
          PYTHONPATH: src
        run: python -m wechat_autoreply demo
      - name: Check public source and history
        run: python scripts/check_release.py --history
      - name: Whitespace check
        run: git diff --check
